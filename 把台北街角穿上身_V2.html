<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>印花樂白T街角試穿</title>
<style>
/* layout: 三欄工作台（圖素庫｜白T畫布｜調整面板），手機改為上畫布、下工具 */
:root{
  --bg:#FAF6EF; --panel:#FFFFFF; --ink:#2B2622; --muted:#7A6F66; --line:#E6DDD0;
  --red:#D9473A; --red-ink:#FFFFFF; --stripe:#F2C94C; --tee:#FFFFFF; --tee-line:#D8CFC2; --stage:#EFE7DA;
  --font:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1B18; --panel:#28241F; --ink:#F1EAE0; --muted:#A99D90; --line:#3A342D;
  --red:#E8604F; --red-ink:#1E1B18; --tee:#FFFFFF; --tee-line:#BDB3A6; --stage:#332E28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1B18; --panel:#28241F; --ink:#F1EAE0; --muted:#A99D90; --line:#3A342D;
  --red:#E8604F; --red-ink:#1E1B18; --tee:#FFFFFF; --tee-line:#BDB3A6; --stage:#332E28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding:0 16px 32px}
header{max-width:1180px;margin:0 auto;padding-block:20px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);letter-spacing:.12em;font-size:12px}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--red)}
.hint{color:var(--muted);font-size:13px;margin:0}
.tape{height:8px;max-width:1180px;margin:0 auto 18px;border-radius:2px;
  background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--stripe) 10px 20px)}
main{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:0;font-size:14px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{border:1px dashed var(--line);background:var(--bg);border-radius:8px;padding:8px 6px 6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:inherit;font-size:12px;touch-action:none}
.thumb:hover,.thumb:focus-visible{border-color:var(--red);border-style:solid;outline:none}
.thumb img{height:72px;width:auto;object-fit:contain;pointer-events:none}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--red);color:var(--red);outline:none}

.stagewrap{background:var(--stage);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage{touch-action:pan-y;position:relative;width:100%;max-width:520px;aspect-ratio:500/560;user-select:none;-webkit-user-select:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.area{position:absolute;left:32%;top:21.43%;width:36%;height:42.86%;outline:1.5px dashed transparent;transition:outline-color .2s}
.area.show{outline-color:rgba(217,71,58,.55)}
.area-label{position:absolute;top:-20px;left:0;font-size:11px;color:#B9AC9C;letter-spacing:.08em;pointer-events:none}
.item{position:absolute;touch-action:none;cursor:move}
.item img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.item.sel{outline:1.5px solid var(--red);outline-offset:2px}
.handle{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:#D9473A;border:2px solid #fff;cursor:nwse-resize;display:none;touch-action:none}
.item.sel .handle{display:block}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--ink);outline:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink);font-weight:700}
.btn.danger{color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.ctl{display:flex;flex-direction:column;gap:4px;font-size:13px}
label.ctl span{display:flex;justify-content:space-between;color:var(--muted)}
label.ctl b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--red)}
.empty{color:var(--muted);font-size:13px;margin:0}
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.layers li button{width:100%;text-align:left;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit;cursor:pointer}
.layers li button[aria-current="true"]{border-color:var(--red);color:var(--red)}
.layers img{width:22px;height:22px;object-fit:contain}

.modal{position:fixed;inset:0;background:rgba(20,16,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{background:var(--panel);border-radius:12px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.modal img{width:100%;border-radius:8px;background:var(--stage)}
.modal p{margin:0;font-size:13px;color:var(--muted)}

.hint .m{display:none}
@media (max-width:900px){
  body{padding:0 12px 24px}
  header{padding-block:12px 8px}
  .hint .d{display:none}.hint .m{display:inline}
  .tape{margin-bottom:10px;height:6px}
  main{grid-template-columns:minmax(0,1fr);gap:12px}
  .stagewrap{order:-2;padding:10px 8px;gap:8px}
  .stage{max-width:min(100%,62vh)}
  #adjust{order:-1}
  .panel{padding:12px;gap:10px}
  #library .group{flex-direction:row;align-items:center;gap:10px}
  #library .group h3{flex:0 0 3em;font-size:13px}
  .thumbs{display:flex;overflow-x:auto;gap:8px;padding-bottom:2px;min-width:0;flex:1}
  .thumb{flex:0 0 78px}
  .thumb img{height:56px}
  .presets{flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1}
  .chip{flex:0 0 auto}
  .stagebar .btn{flex:1 1 auto}
  .layers{flex-direction:row;overflow-x:auto}
  .layers li{flex:0 0 auto}
}
@media (pointer:coarse){
  .handle{width:30px;height:30px;right:-15px;bottom:-15px}
  .btn{padding:11px 12px}
  input[type=range]{height:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="brand">
    <small>inBlooom ✕ 白T 自由配</small>
    <h1>把<span>台北街角</span>穿上身</h1>
  </div>
  <p class="hint"><span class="d">點選或拖曳圖素到白T上・拖曳移動・紅點縮放</span><span class="m">點圖素加入・單指移動・雙指縮放旋轉</span></p>
</header>
<div class="tape" aria-hidden="true"></div>

<main>
  <aside class="panel" id="library" aria-label="圖素庫">
    <h2>圖素庫</h2>
    <div class="group"><h3>人物</h3><div class="thumbs" id="cat-person"></div></div>
    <div class="group"><h3>街景</h3><div class="thumbs" id="cat-street"></div></div>
    <div class="group"><h3>範例玩法</h3><div class="presets" id="presets"></div></div>
  </aside>

  <section class="stagewrap">
    <div class="stage" id="stage">
      <svg viewBox="0 0 500 560" aria-hidden="true">
        <path d="M172 38 C196 66 304 66 328 38 L420 70 L492 168 L420 214 L396 186 L398 534 Q250 548 102 534 L104 186 L80 214 L8 168 L80 70 Z" fill="var(--tee)" stroke="var(--tee-line)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M172 38 C196 66 304 66 328 38" fill="none" stroke="var(--tee-line)" stroke-width="7" stroke-linecap="round"/>
        <path d="M104 186 L104 120 M396 186 L396 120" stroke="var(--tee-line)" stroke-width="1.5" opacity=".6"/>
        <path d="M150 520 Q250 528 350 520" stroke="var(--tee-line)" stroke-width="1.2" fill="none" opacity=".5"/>
      </svg>
      <div class="area" id="area"><div class="area-label">可印刷範圍</div></div>
    </div>
    <div class="stagebar">
      <button class="btn" id="b-guide" type="button" aria-pressed="false">顯示印刷範圍</button>
      <button class="btn danger" id="b-clear" type="button">全部清除</button>
      <button class="btn primary" id="b-export" type="button">產生設計圖</button>
    </div>
  </section>

  <aside class="panel" id="adjust" aria-label="調整面板">
    <h2>調整選取的圖素</h2>
    <p class="empty" id="noSel">點一下白T上的圖素開始調整。</p>
    <div class="group" id="ctl" hidden>
      <label class="ctl" for="r-size"><span>大小 <b id="v-size"></b></span><input type="range" id="r-size" min="8" max="100" step="1"></label>
      <label class="ctl" for="r-rot"><span>旋轉 <b id="v-rot"></b></span><input type="range" id="r-rot" min="-180" max="180" step="1"></label>
      <div class="row">
        <button class="btn" id="b-up" type="button">上移一層</button>
        <button class="btn" id="b-down" type="button">下移一層</button>
        <button class="btn" id="b-flip" type="button">左右翻轉</button>
        <button class="btn" id="b-dup" type="button">複製</button>
      </div>
      <button class="btn danger" id="b-del" type="button">刪除這個圖素</button>
    </div>
    <div class="group">
      <h3>圖層（上方在最前）</h3>
      <ul class="layers" id="layers"></ul>
    </div>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h3 id="m-title" style="margin:0">你的白T設計圖</h3>
    <img id="m-img" alt="白T設計圖預覽">
    <p>電腦：在圖片上按右鍵「另存圖片」。手機：長按圖片儲存。</p>
    <a class="btn primary" id="m-dl" download="inblooom-tee.png" style="text-align:center;text-decoration:none">下載 PNG</a>
    <button class="btn" id="m-close" type="button">關閉</button>
  </div>
</div>

// 圖素清單：新增圖素只要在這裡加一筆
const ELEMENTS=[
  {key:'girl',name:'板凳女孩',cat:'person'},
  {key:'mirror',name:'路口反光鏡',cat:'street'},
  {key:'door',name:'老公寓鐵門',cat:'street'},
  {key:'box',name:'烏鴉電箱',cat:'street'},
];
const AREA_W=180, AREA_H=240; // SVG 單位，印刷範圍寬高
const PRESETS={
  '街角一隅':[{key:'door',x:.28,y:.52,w:.42},{key:'box',x:.74,y:.68,w:.38},{key:'girl',x:.58,y:.70,w:.34},{key:'mirror',x:.86,y:.36,w:.2}],
  '胸前小圖':[{key:'girl',x:.78,y:.16,w:.2}],
  '烏鴉守門':[{key:'door',x:.5,y:.5,w:.56},{key:'box',x:.5,y:.83,w:.3,rot:-6}],
  '重複排列':[{key:'mirror',x:.2,y:.3,w:.18},{key:'mirror',x:.5,y:.3,w:.18},{key:'mirror',x:.8,y:.3,w:.18},{key:'girl',x:.5,y:.75,w:.3}],
};
const ratio={}; // 高/寬
const $=s=>document.querySelector(s);
const area=$('#area');
let items=[], sel=null, uid=0;

function load(){return Promise.all(ELEMENTS.map(e=>new Promise(r=>{const i=new Image();i.onload=()=>{ratio[e.key]=i.naturalHeight/i.naturalWidth;r()};i.src=IMG[e.key]})))}

function thumbs(){
  ELEMENTS.forEach(e=>{
    const b=document.createElement('button');b.type='button';b.className='thumb';
    b.innerHTML=`<img src="${IMG[e.key]}" alt="">${e.name}`;
    b.addEventListener('pointerdown',ev=>startThumbDrag(ev,e.key));
    b.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();add(e.key)}});
    $('#cat-'+e.cat).append(b);
  });
  Object.keys(PRESETS).forEach(n=>{
    const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=n;
    c.onclick=()=>{items=[];PRESETS[n].forEach(p=>items.push(fit({id:++uid,rot:0,flip:false,...p})));select(null);render()};
    $('#presets').append(c);
  });
}

// 高度佔印刷範圍的比例
const hFrac=it=>it.w*AREA_W*ratio[it.key]/AREA_H;
function fit(it){ // 限制在印刷範圍內
  const maxW=Math.min(1,AREA_H/(AREA_W*ratio[it.key]));
  it.w=Math.max(.08,Math.min(it.w,maxW));
  const hw=it.w/2, hh=hFrac(it)/2;
  it.x=Math.min(1-hw,Math.max(hw,it.x)); it.y=Math.min(1-hh,Math.max(hh,it.y));
  return it;
}
function add(key,x=.5,y=.5){const it=fit({id:++uid,key,x,y,w:.4,rot:0,flip:false});items.push(it);select(it.id);render()}

function render(){
  area.querySelectorAll('.item').forEach(n=>n.remove());
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item'+(it.id===sel?' sel':'');d.dataset.id=it.id;
    const h=hFrac(it);
    Object.assign(d.style,{left:(it.x-it.w/2)*100+'%',top:(it.y-h/2)*100+'%',width:it.w*100+'%',height:h*100+'%',zIndex:i+1,
      transform:`rotate(${it.rot}deg) scaleX(${it.flip?-1:1})`});
    d.innerHTML=`<img src="${IMG[it.key]}" alt=""><span class="handle"></span>`;
    d.addEventListener('pointerdown',startMove);
    d.querySelector('.handle').addEventListener('pointerdown',startResize);
    area.append(d);
  });
  panel();
}
function cur(){return items.find(i=>i.id===sel)}
function select(id){sel=id;render()}
function panel(){
  const it=cur();$('#ctl').hidden=!it;$('#noSel').hidden=!!it;
  if(it){
    $('#r-size').value=Math.round(it.w*100);$('#v-size').textContent=Math.round(it.w*100)+'%';
    $('#r-rot').value=it.rot;$('#v-rot').textContent=it.rot+'°';
    const i=items.indexOf(it);$('#b-up').disabled=i===items.length-1;$('#b-down').disabled=i===0;
  }
  const L=$('#layers');L.innerHTML='';
  if(!items.length){L.innerHTML='<li class="empty">白T上還沒有圖素。</li>';return}
  [...items].reverse().forEach(it=>{
    const li=document.createElement('li');const b=document.createElement('button');b.type='button';
    b.setAttribute('aria-current',it.id===sel);
    b.innerHTML=`<img src="${IMG[it.key]}" alt="">${ELEMENTS.find(e=>e.key===it.key).name}`;
    b.onclick=()=>select(it.id);li.append(b);L.append(li);
  });
}

// 拖曳
function areaRect(){return area.getBoundingClientRect()}
function startMove(ev){
  if(ev.target.classList.contains('handle'))return;
  ev.preventDefault();const it=items.find(i=>i.id==ev.currentTarget.dataset.id);
  if(sel!==it.id)select(it.id);
  const r=areaRect(),ox=it.x,oy=it.y,sx=ev.clientX,sy=ev.clientY;
  track(e=>{if(pinched)return;it.x=ox+(e.clientX-sx)/r.width;it.y=oy+(e.clientY-sy)/r.height;fit(it);quick(it)});
}
function startResize(ev){
  ev.preventDefault();ev.stopPropagation();const it=cur();
  const r=areaRect(),cx=r.left+it.x*r.width,cy=r.top+it.y*r.height;
  const d0=Math.hypot(ev.clientX-cx,ev.clientY-cy),w0=it.w;
  track(e=>{it.w=w0*Math.hypot(e.clientX-cx,e.clientY-cy)/d0;fit(it);quick(it)});
}
function track(move){
  area.classList.add('show');
  const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(!$('#b-guide').classList.contains('on'))area.classList.remove('show');render()};
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function quick(it){ // 拖曳中只更新該元素
  const d=area.querySelector(`[data-id="${it.id}"]`),h=hFrac(it);
  Object.assign(d.style,{left:(it.x-it.w/2)*100+'%',top:(it.y-h/2)*100+'%',width:it.w*100+'%',height:h*100+'%',transform:`rotate(${it.rot}deg) scaleX(${it.flip?-1:1})`});
  $('#r-rot').value=it.rot;$('#v-rot').textContent=it.rot+'°';
  $('#r-size').value=Math.round(it.w*100);$('#v-size').textContent=Math.round(it.w*100)+'%';
}
// 從圖素庫拖到白T（點一下則直接加到中央）
function startThumbDrag(ev,key){
  const sx=ev.clientX,sy=ev.clientY;let ghost=null;
  const move=e=>{
    if(!ghost&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){ghost=document.createElement('img');ghost.src=IMG[key];
      Object.assign(ghost.style,{position:'fixed',width:'70px',pointerEvents:'none',opacity:.85,zIndex:10});document.body.append(ghost);area.classList.add('show')}
    if(ghost){ghost.style.left=e.clientX-35+'px';ghost.style.top=e.clientY-35+'px'}
  };
  const up=e=>{
    removeEventListener('pointermove',move);removeEventListener('pointerup',up);
    if(!ghost){add(key);return}
    ghost.remove();if(!$('#b-guide').classList.contains('on'))area.classList.remove('show');
    const r=areaRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    if(x>-.3&&x<1.3&&y>-.3&&y<1.3)add(key,x,y);
  };
  addEventListener('pointermove',move);addEventListener('pointerup',up);
}

// 面板控制
$('#r-size').oninput=e=>{const it=cur();it.w=e.target.value/100;fit(it);render()};
$('#r-rot').oninput=e=>{const it=cur();it.rot=+e.target.value;render()};
$('#b-flip').onclick=()=>{const it=cur();it.flip=!it.flip;render()};
$('#b-dup').onclick=()=>{const it=cur();const c=fit({...it,id:++uid,x:it.x+.06,y:it.y+.06});items.push(c);select(c.id)};
$('#b-del').onclick=()=>{items=items.filter(i=>i.id!==sel);select(null)};
function shift(n){const i=items.indexOf(cur()),j=i+n;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}
$('#b-up').onclick=()=>shift(1);$('#b-down').onclick=()=>shift(-1);
$('#b-clear').onclick=e=>{
  const b=e.currentTarget;if(!items.length)return;
  if(b.dataset.armed){items=[];select(null);delete b.dataset.armed;b.textContent='全部清除';return}
  b.dataset.armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{delete b.dataset.armed;b.textContent='全部清除'},2500);
};
$('#b-guide').onclick=e=>{const on=e.currentTarget.classList.toggle('on');e.currentTarget.setAttribute('aria-pressed',on);area.classList.toggle('show',on)};
// 手機雙指：縮放＋旋轉選取中的圖素
const pts=new Map();let pinch=null,pinched=false;
const geo=()=>{const[a,b]=[...pts.values()];return[Math.hypot(a[0]-b[0],a[1]-b[1]),Math.atan2(b[1]-a[1],b[0]-a[0])]};
$('#stage').addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&cur()){const it=cur(),[d,a]=geo();pinch={it,d0:d,a0:a,w0:it.w,r0:it.rot};pinched=true;e.preventDefault();e.stopImmediatePropagation()}
},true);
addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&pts.size===2){const p=pinch,[d,a]=geo();p.it.w=p.w0*d/p.d0;
    let r=Math.round(p.r0+(a-p.a0)*180/Math.PI);r=((r+540)%360)-180;p.it.rot=r;fit(p.it);quick(p.it)}
});
const lift=e=>{pts.delete(e.pointerId);if(pts.size<2&&pinch){pinch=null;render()}if(!pts.size)pinched=false};
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);
$('#stage').addEventListener('pointerdown',e=>{if(!e.target.closest('.item'))select(null)});
addEventListener('keydown',e=>{
  const it=cur();if(!it||e.target.matches('input'))return;
  const s=e.shiftKey?.05:.01,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];
  if(m){e.preventDefault();it.x+=m[0];it.y+=m[1];fit(it);render()}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#b-del').click()}
  if(e.key==='Escape')select(null);
});

// 匯出：合成白T＋圖素
async function exportPNG(){
  const S=2,cv=document.createElement('canvas');cv.width=500*S;cv.height=560*S;const g=cv.getContext('2d');
  g.fillStyle='#F3EDE3';g.fillRect(0,0,cv.width,cv.height);
  const svg=$('#stage svg').outerHTML.replace(/var\(--tee\)/g,'#FFFFFF').replace(/var\(--tee-line\)/g,'#D8CFC2')
    .replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120"');
  const tee=await img('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));g.drawImage(tee,0,0,cv.width,cv.height);
  const ax=160*S,ay=120*S,aw=AREA_W*S,ah=AREA_H*S;
  for(const it of items){
    const im=await img(IMG[it.key]),w=it.w*aw,h=w*ratio[it.key];
    g.save();g.translate(ax+it.x*aw,ay+it.y*ah);g.rotate(it.rot*Math.PI/180);if(it.flip)g.scale(-1,1);
    g.drawImage(im,-w/2,-h/2,w,h);g.restore();
  }
  const url=cv.toDataURL('image/png');$('#m-img').src=url;$('#m-dl').href=url;$('#m-dl').hidden=window.top!==window;$('#modal').hidden=false;$('#m-close').focus();
}
const img=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
$('#b-export').onclick=()=>exportPNG().catch(()=>{$('#b-export').textContent='匯出失敗，請再試一次'});
$('#m-close').onclick=()=>$('#modal').hidden=true;
addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};

load().then(()=>{thumbs();PRESETS['街角一隅'].forEach(p=>items.push(fit({id:++uid,rot:0,flip:false,...p})));render()});
</script>
